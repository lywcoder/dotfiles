# Windows psmux 3.4+: match the habits in linux/common/tmux.conf.
# Kept independent: no Linux shell commands or Linux configuration paths.
set -g default-shell pwsh
set -g prefix C-b
set -g mouse on
set -g history-limit 20000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 10

# vi copy mode: prefix+[ enters; v selects and y copies.
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Splits and new windows inherit the active pane's directory.
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key c new-window -c "#{pane_current_path}"

set -g status on
set -g status-position bottom
set -g status-style "bg=colour235,fg=colour250"
set -g window-status-current-style "fg=colour81,bold"
set -g pane-active-border-style "fg=colour81"
set -g status-left " [#S] "
set -g status-right " %Y-%m-%d %H:%M "

# Reload the managed Windows entry; does not touch Linux tmux sessions.
bind-key r source-file ~/.psmux.conf \; display-message "psmux config reloaded"
